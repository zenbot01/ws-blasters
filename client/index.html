<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blasters (Single Player)</title>
  <style>
    body { margin: 0; background: #0b0f16; color: #e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial; }
    header { padding: 10px 14px; display: flex; gap: 14px; align-items: baseline; border-bottom: 1px solid #1f2937; }
    header h1 { font-size: 16px; margin: 0; }
    header .muted { color: #9aa4b2; font-size: 13px; }
    #hud { padding: 10px 14px; color: #9aa4b2; font-size: 13px; }
    canvas { width: 100vw; height: calc(100vh - 94px); display: block; }
    .pill { padding: 2px 8px; border: 1px solid #243244; border-radius: 999px; color: #c9d4e3; }
  </style>
</head>
<body>
  <header>
    <h1>Blasters (Single Player)</h1>
    <span class="pill" id="status">offline</span>
    <span class="muted">Move: WASD / Arrows · Aim: IJKL · Fire: Space · Reset: R</span>
  </header>

  <div id="hud"></div>
  <div id="build" style="padding: 0 14px 10px; color:#6b7280; font-size:12px;"></div>
  <canvas id="c"></canvas>

<script type="module" src="./main.js"></script>
</body>
</html>
