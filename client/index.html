<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blasters (Single Player)</title>
  <style>
    body { margin: 0; background: #0b0f16; color: #e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial; }
    header { padding: 10px 14px; display: flex; gap: 14px; align-items: baseline; border-bottom: 1px solid #1f2937; }
    header h1 { font-size: 16px; margin: 0; }
    header .muted { color: #9aa4b2; font-size: 13px; }
    #hud { padding: 10px 14px; color: #9aa4b2; font-size: 13px; }
    canvas { width: 100vw; touch-action: none; height: calc(100vh - 94px); display: block; }
    .pill { padding: 2px 8px; border: 1px solid #243244; border-radius: 999px; color: #c9d4e3; }
    button.pill { font: inherit; }
    button.pill:hover { border-color: rgba(56, 189, 248, 0.55); }
  </style>
</head>
<body>
  <header>
    <h1>Blasters (Single Player)</h1>
    <span class="pill" id="status">offline</span>
    <button class="pill" id="btnPause" type="button" style="background:transparent; cursor:pointer;">Pause</button>
    <button class="pill" id="btnSave" type="button" style="background:transparent; cursor:pointer;">Save</button>
    <span class="muted">Move: WASD / Arrows · Aim: IJKL or Mouse · Fire: Space or Click · Reset: R · Continue: C · Resume: V · Save: X</span>
  </header>

  <div id="hud"></div>
  <div style="padding: 0 14px 8px; color:#6b7280; font-size:12px;">Mobile: left stick = move · right stick = aim/fire</div>
  <div id="build" style="padding: 0 14px 10px; color:#6b7280; font-size:12px;"></div>
  <canvas id="c"></canvas>
  <div id="touch" style="position:fixed; inset:0; pointer-events:auto; user-select:none; -webkit-user-select:none;">
    <div id="stickL" style="position:absolute; left:0; bottom:0; width:50vw; height:60vh;"></div>
    <div id="stickR" style="position:absolute; right:0; bottom:0; width:50vw; height:60vh;"></div>
    <div id="padL" style="position:absolute; left:22px; bottom:22px; width:120px; height:120px; border-radius:999px; border:2px solid rgba(147,197,253,0.25); background:rgba(0,0,0,0.15); display:none;"></div>
    <div id="padL2" style="position:absolute; left:22px; bottom:22px; width:46px; height:46px; border-radius:999px; border:2px solid rgba(147,197,253,0.55); background:rgba(59,130,246,0.12); display:none;"></div>
    <div id="padR" style="position:absolute; right:22px; bottom:22px; width:120px; height:120px; border-radius:999px; border:2px solid rgba(254,202,202,0.22); background:rgba(0,0,0,0.12); display:none;"></div>
    <div id="padR2" style="position:absolute; right:22px; bottom:22px; width:46px; height:46px; border-radius:999px; border:2px solid rgba(254,202,202,0.55); background:rgba(239,68,68,0.10); display:none;"></div>
  </div>


<script type="module" src="./main.js"></script>
</body>
</html>
